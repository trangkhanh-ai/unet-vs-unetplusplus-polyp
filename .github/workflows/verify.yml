name: Verify course project
on:
  push:
    branches: [main, codex/full-polyp-project]
  pull_request:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -B project.py test --output results/ci_checks
      - name: Check frozen source and manifest bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          data=json.loads(Path('configs/pretrained_release.json').read_text())
          for name,expected in data['source_hashes'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          PY
